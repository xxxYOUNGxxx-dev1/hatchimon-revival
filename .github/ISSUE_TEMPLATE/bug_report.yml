name: Compatibility or gameplay bug
description: Report a reproducible problem with a published build.
body:
  - type: input
    id: version
    attributes:
      label: Release version
      placeholder: 1.13-dev5
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Device environment
      description: Model, Android/API version, ABI, and page size if known. Do not include device serial numbers.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed behavior
      description: Explain how to reproduce the issue and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Share the relevant crash excerpt, not a full personal bugreport or save file.
